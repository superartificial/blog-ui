<a class="post-row"
   [routerLink]="['/posts', post().slug]"
   [style.--row-color]="rowColor(post().categorySlug)">
  <div class="post-row-inner">
    <div class="post-body">
      <h2 class="post-title">{{ post().title }}</h2>
      @if (post().tags && post().tags!.length > 0) {
        <div class="post-tags">
          @for (tag of post().tags!; track tag; let last = $last) {
            <span class="post-tag-item">{{ tag }}</span>@if (!last) {<span class="post-tag-sep"> · </span>}
          }
        </div>
      }
    </div>
    <div class="post-meta">
      @if (post().categoryName) {
        <span class="post-cat">{{ post().categoryName }}</span>
      }
      <time class="post-date">{{ formatDate(post().createdAt) }}</time>
    </div>
  </div>
  <span class="post-arrow" aria-hidden="true">→</span>
</a>
